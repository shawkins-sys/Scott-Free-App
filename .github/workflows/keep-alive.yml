# Pings Supabase every 3 days so the free project never pauses.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'   # 06:17 UTC every 3rd day
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
